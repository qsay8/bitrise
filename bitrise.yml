
---
format_version: '20'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

meta:
  bitrise.io:
    stack: osx-xcode-27.1.x

workflows:
  primary:
    title: "🦀 RustDesk Mac Session"
    description: Manually triggered macOS remote desktop session

    envs:
    - SESSION_DURATION: '6'
    - MAC_PASSWORD: "P@ssw0rd!"
    - MAC_USER: mj
    
    - UNIQUE_IP: 'false'

    steps:
    - git-clone@8: {}

    - script@1:
        title: "📥 Download Project Scripts"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"

            BASE="https://raw.githubusercontent.com/qsay8/github-mac-remote/main/scripts"
            mkdir -p scripts

            for file in \
              ip-manager.sh \
              system-info.sh \
              install-parsec.sh \
              setup-rustdesk.sh \
              setup-warp.sh \
              keep-alive.sh
            do
              echo "Downloading $file"
              curl --fail --silent --show-error --location \
                --retry 3 \
                "$BASE/$file" -o "scripts/$file"
              test -s "scripts/$file"
              chmod +x "scripts/$file"
            done

            echo "Project scripts downloaded."

    - script@1:
        title: "📦 Initialize IP History"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"
            [ -f .ip-history.json ] || \
              echo '{"history":[]}' > .ip-history.json

    - script@1:
        title: "🌐 Detect and Track IP"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"

            export GITHUB_ENV="$BITRISE_SOURCE_DIR/.github_env"
            touch "$GITHUB_ENV"

            ./scripts/ip-manager.sh

            if [ -s "$GITHUB_ENV" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [ -n "$line" ] || continue
                case "$line" in
                  *=*)
                    key="${line%%=*}"
                    value="${line#*=}"
                    if [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                      envman add --key "$key" --value "$value"
                    fi
                    ;;
                esac
              done < "$GITHUB_ENV"
            fi

            echo "IP detection completed."

    - script@1:
        title: "🔒 Setup Cloudflare WARP (Optional)"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"

            if [ "${UNIQUE_IP:-false}" = "true" ]; then
              ./scripts/setup-warp.sh
            else
              echo "WARP disabled."
            fi

    - script@1:
        title: "🔐 Configure macOS Admin Account"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail

            ADMIN_USER="${MAC_USER:-mj}"
            : "${MAC_PASSWORD:?Set MAC_PASSWORD in Bitrise Secrets}"

            if ! id "$ADMIN_USER" >/dev/null 2>&1; then
              echo "Account $ADMIN_USER does not exist." >&2
              echo "Create it through an approved macOS provisioning method." >&2
              exit 1
            fi

            sudo dscl . -passwd "/Users/$ADMIN_USER" "$MAC_PASSWORD"
            sudo dseditgroup -o edit -a "$ADMIN_USER" -t user admin

            echo "macOS account configured."

    - script@1:
        title: "📊 System Information"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"
            ./scripts/system-info.sh

    - script@1:
        title: "🎮 Install Parsec"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"
            ./scripts/install-parsec.sh

    - script@1:
        title: "🦀 Setup RustDesk"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"

            RUSTDESK_PASSWORD="$(openssl rand -hex 12)"
            envman add --key RUSTDESK_PASSWORD \
              --value "$RUSTDESK_PASSWORD" --sensitive
            export RUSTDESK_PASSWORD

            ./scripts/setup-rustdesk.sh
            sleep 10

            RUSTDESK_CLI="/Applications/RustDesk.app/Contents/MacOS/rustdesk"
            RUSTDESK_ID=""

            if [ -x "$RUSTDESK_CLI" ]; then
              RUSTDESK_ID="$("$RUSTDESK_CLI" --get-id 2>/dev/null || true)"
            fi

            if [ -z "$RUSTDESK_ID" ]; then
              RUSTDESK_ID="$(cat \
                "$HOME/Library/Application Support/RustDesk/id" \
                2>/dev/null || true)"
            fi

            envman add --key RUSTDESK_ID \
              --value "${RUSTDESK_ID:-Check build logs}"

    - script@1:
        title: "💾 Prepare Connection Information"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail

            : "${MAC_PASSWORD:?Missing MAC_PASSWORD secret}"
            : "${RUSTDESK_PASSWORD:?Missing RustDesk password}"

            echo "Build: ${BITRISE_BUILD_NUMBER:-unknown}"
            echo "macOS: $(sw_vers -productVersion)"
            echo "Architecture: $(uname -m)"
            echo "Public IP: ${CURRENT_IP:-unknown}"
            echo "RustDesk ID: ${RUSTDESK_ID:-unavailable}"
            echo "Passwords are not printed or saved in build artifacts."

    - script@1:
        title: "⏱️ Keep Session Alive"
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail
            cd "$BITRISE_SOURCE_DIR"

            export DURATION_HOURS="${SESSION_DURATION:-6}"
            ./scripts/keep-alive.sh

    - script@1:
        title: "💾 Check IP History"
        is_always_run: true
        inputs:
        - content: |
            #!/bin/bash
            set -euo pipefail

            if [ -f "$BITRISE_SOURCE_DIR/.ip-history.json" ]; then
              echo "IP history file exists."
            else
              echo "IP history file missing."
              exit 1
            fi
